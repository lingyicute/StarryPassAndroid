name: Android checks and nightly

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4
      - name: Install compile SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Test and build
        run: bash gradlew --no-daemon testDebugUnitTest assembleRelease lintDebug
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: app-release
          path: app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lint-reports
          path: app/build/reports/lint-results-debug.*
          if-no-files-found: ignore

  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: app-release
          path: apk
      - name: Publish nightly
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # A re-run of an older main workflow must never roll nightly back.
          latest_sha="$(git ls-remote --exit-code origin refs/heads/main | cut -f1)"
          if [[ "$latest_sha" != "$GITHUB_SHA" ]]; then
            echo "Skipping nightly publication for a stale main commit."
            exit 0
          fi
          notes="auto build · ${GITHUB_SHA:0:7} · ${GITHUB_REF_NAME} · unsigned APK"
          if gh release view nightly >/dev/null 2>&1; then
            # Update in place and upload the new APK before moving the tag or
            # notes so a failed upload never leaves metadata ahead of its asset.
            gh release upload nightly apk/app-release-unsigned.apk --clobber
            # --target updates release metadata, not the existing Git tag ref.
            git tag --force nightly "$GITHUB_SHA"
            git push --force origin refs/tags/nightly
            gh release edit nightly --notes "$notes" --target "$GITHUB_SHA"
          else
            git tag --force nightly "$GITHUB_SHA"
            git push --force origin refs/tags/nightly
            gh release create nightly apk/app-release-unsigned.apk \
              --title "Nightly Build" --notes "$notes" \
              --prerelease --target "$GITHUB_SHA"
          fi
